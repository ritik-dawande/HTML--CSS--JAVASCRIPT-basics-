<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radio element</title>
</head>
<body>
   
    <form action="/server">
    <div>
        <input type="radio" name="fruit" id="mango">
        <label for="mango">Mango</label>

        <input type="radio" name="fruit" id="blackberry">
        <label for="blackberry">Blackberry</label>

        <input type="radio" name="fruit" id="cherry">
        <label for="cherry">Cherry</label>
    </div>
</form>
</body>
</html>
